name: Sync About Me from aih.github.io

# Mirrors https://aih.github.io/ into aboutme/index.html, then publishes.
#
# Triggers:
#   repository_dispatch  sent by aih/aih.github.io on push to its main branch
#   schedule             daily safety net in case a dispatch is missed
#   workflow_dispatch    manual run from the Actions tab
#   push                 whenever the sync script itself changes

on:
  repository_dispatch:
    types: [aboutme-updated]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/sync_aboutme.py'
      - '.github/workflows/sync-aboutme.yml'

permissions:
  contents: write
  # Passed through to blog-build-and-publish.yml, which deploys to Pages.
  pages: write
  id-token: write

concurrency:
  group: sync-aboutme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the source page
        run: python3 scripts/sync_aboutme.py

      - name: Commit if the mirror changed
        id: commit
        run: |
          if git diff --quiet -- aboutme/index.html; then
            echo "No change to aboutme/index.html"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aboutme/index.html
          git commit -m "Sync About Me page from aih.github.io"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/blog-build-and-publish.yml
    with:
      ref: main
    secrets: inherit
