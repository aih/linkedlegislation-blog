# Editor configuration, read by Decap CMS. Reload the editor in the browser
# after changing this file.

backend:
  name: github
  repo: aih/linkedlegislation-blog
  branch: main

# Routes reads and writes through `npx decap-server` on port 8081 instead of
# the GitHub API, so the editor saves into this working copy. Decap uses the
# proxy only when the page is served from localhost; anywhere else it falls
# back to the `backend` above, which needs an OAuth client that this repo does
# not configure.
local_backend: true

# Preview links point at the local Jekyll server.
site_url: http://localhost:4000

media_folder: assets/img/uploads
public_folder: /assets/img/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: posts
    label: Posts
    label_singular: Post
    description: Files in _posts. Only .md files are listed; the legacy .html posts are left alone.
    folder: _posts
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: '{{year}}-{{month}}-{{day}}-{{slug}}/'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: author, label: Author, widget: string, default: Ari Hershowitz, required: false }
      # Required so the field can never be saved blank. Jekyll aborts the build
      # on `date: ''`, and Decap writes an empty string for a cleared field.
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', default: '{{now}}' }
      - { name: last-updated, label: Last updated, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', default: '', required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: thumbnail-img, label: Thumbnail image, widget: image, required: false }
      - { name: cover-img, label: Cover image, widget: image, required: false }
      - { name: share-img, label: Social share image, widget: image, required: false }
      # One entry per image. `role` says which image it is (Thumbnail, Cover,
      # a caption); the `ai-*` fields identify an image an AI model made.
      - name: image-credits
        label: Image credits
        label_singular: Image credit
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.role}}: {{fields.title}}{{fields.ai-model}}'
        fields:
          - { name: role, label: Which image, widget: string, required: false, hint: 'Thumbnail, Cover, Cover source, In body' }
          - { name: title, label: Title, widget: string, required: false }
          - { name: creator, label: Creator, widget: string, required: false }
          - { name: year, label: Year, widget: string, required: false }
          - { name: source, label: Source URL, widget: string, required: false }
          - { name: source-name, label: Source name, widget: string, required: false, hint: 'Wikimedia Commons, the site name' }
          - { name: license, label: License, widget: string, required: false, hint: 'Public domain, CC BY 4.0' }
          - { name: license-url, label: License URL, widget: string, required: false }
          - { name: note, label: Note, widget: text, required: false }
          - { name: ai-model, label: 'AI model', widget: string, required: false, hint: 'Fill in for any AI-made image. Leave blank otherwise.' }
          - { name: ai-version, label: 'AI version', widget: string, required: false }
          - { name: ai-date, label: 'AI date', widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, default: '', required: false }
          - { name: ai-role, label: 'AI did what', widget: string, required: false, hint: 'Generated, Composited, Upscaled. Defaults to Generated.' }
      - { name: body, label: Body, widget: markdown, modes: [rich_text, raw] }

  - name: drafts
    label: Drafts
    label_singular: Draft
    description: Files in _drafts. They are built by `jekyll serve --drafts` and skipped by the production build.
    folder: _drafts
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: author, label: Author, widget: string, default: Ari Hershowitz, required: false }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', default: '{{now}}' }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: thumbnail-img, label: Thumbnail image, widget: image, required: false }
      - { name: cover-img, label: Cover image, widget: image, required: false }
      # One entry per image. `role` says which image it is (Thumbnail, Cover,
      # a caption); the `ai-*` fields identify an image an AI model made.
      - name: image-credits
        label: Image credits
        label_singular: Image credit
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.role}}: {{fields.title}}{{fields.ai-model}}'
        fields:
          - { name: role, label: Which image, widget: string, required: false, hint: 'Thumbnail, Cover, Cover source, In body' }
          - { name: title, label: Title, widget: string, required: false }
          - { name: creator, label: Creator, widget: string, required: false }
          - { name: year, label: Year, widget: string, required: false }
          - { name: source, label: Source URL, widget: string, required: false }
          - { name: source-name, label: Source name, widget: string, required: false, hint: 'Wikimedia Commons, the site name' }
          - { name: license, label: License, widget: string, required: false, hint: 'Public domain, CC BY 4.0' }
          - { name: license-url, label: License URL, widget: string, required: false }
          - { name: note, label: Note, widget: text, required: false }
          - { name: ai-model, label: 'AI model', widget: string, required: false, hint: 'Fill in for any AI-made image. Leave blank otherwise.' }
          - { name: ai-version, label: 'AI version', widget: string, required: false }
          - { name: ai-date, label: 'AI date', widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, default: '', required: false }
          - { name: ai-role, label: 'AI did what', widget: string, required: false, hint: 'Generated, Composited, Upscaled. Defaults to Generated.' }
      - { name: body, label: Body, widget: markdown, modes: [rich_text, raw] }
