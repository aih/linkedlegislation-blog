# Editor configuration, read by Sveltia CMS (and by Decap CMS, which uses the
# same format). Reload the editor in the browser after changing this file.

backend:
  name: github
  repo: aih/blog
  branch: main

# Decap CMS only: routes writes through `npx decap-server` instead of the
# GitHub API. Sveltia CMS writes to the working tree and ignores this key.
local_backend: true

media_folder: assets/img/uploads
public_folder: /assets/img/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: posts
    label: Posts
    label_singular: Post
    description: Files in _posts. Only .md files are listed; the legacy .html posts are left alone.
    folder: _posts
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: '{{year}}-{{month}}-{{day}}-{{slug}}/'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: author, label: Author, widget: string, default: Ari Hershowitz, required: false }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', default: '{{now}}' }
      - { name: last-updated, label: Last updated, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: thumbnail-img, label: Thumbnail image, widget: image, required: false }
      - { name: cover-img, label: Cover image, widget: image, required: false }
      - { name: share-img, label: Social share image, widget: image, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: drafts
    label: Drafts
    label_singular: Draft
    description: Files in _drafts. They are built by `jekyll serve --drafts` and skipped by the production build.
    folder: _drafts
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{slug}}'
    sortable_fields: [title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - { name: author, label: Author, widget: string, default: Ari Hershowitz, required: false }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: thumbnail-img, label: Thumbnail image, widget: image, required: false }
      - { name: cover-img, label: Cover image, widget: image, required: false }
      - { name: body, label: Body, widget: markdown }
